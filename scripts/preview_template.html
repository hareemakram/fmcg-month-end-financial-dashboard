<title>Aurora FMCG Month-End Report</title>
<style>
/* Layout: a Power BI canvas (header band, KPI tile row, two chart rows) per report page; stacks to one column on phones.
   Single deliberate light theme, mirroring the Power BI report theme (theme/Aurora_FMCG_Theme.json). */
:root{
  color-scheme: light;
  --page:#F4F3EF; --surface:#FFFFFF; --surface-2:#FAFAF8; --hair:#E6E5DF; --grid:#ECEBE6;
  --ink:#0B0B0B; --ink-2:#52514E; --muted:#898781; --axis:#C3C2B7; --navy:#0F1B2D; --navy-ink:#C9D3E3;
  --actual:#2A78D6; --forecast:#EB6834; --budget:#1BAF7A; --prior:#A9A7A0;
  --good:#0CA30C; --good-text:#006300; --bad:#D03B3B; --warn:#FAB219;
  --font: "Segoe UI", "Segoe UI Variable", system-ui, -apple-system, sans-serif;
  --font-strong: "Segoe UI Semibold", "Segoe UI", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:13px;margin:0}
.wrap{max-width:1320px;margin:0 auto;padding-block:16px 28px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.app-bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px;color:var(--ink-2);font-size:12px}
.app-bar b{color:var(--ink);font-family:var(--font-strong);font-weight:600}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--hair);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.tab[aria-selected="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab:focus-visible,select:focus-visible,.exp:focus-visible{outline:2px solid var(--actual);outline-offset:2px}
header.hdr{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2.2fr) minmax(0,.9fr);gap:12px;align-items:center;margin-bottom:12px}
.hdr h1{margin:0;font-family:var(--font-strong);font-weight:600;font-size:24px;letter-spacing:-.01em;text-wrap:balance}
.hdr p{margin:2px 0 0;color:var(--muted);font-size:12px}
.slicers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.slicer{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:6px 10px}
.slicer label{display:block;font-family:var(--font-strong);font-weight:600;font-size:10px;color:var(--ink-2);letter-spacing:.02em}
.slicer select{width:100%;border:0;background:transparent;font:inherit;color:var(--ink);padding:2px 0;cursor:pointer}
.period{background:var(--navy);color:#fff;border-radius:10px;padding:9px 14px}
.period small{display:block;color:var(--navy-ink);font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.period b{font-family:var(--font-strong);font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:10px;box-shadow:0 2px 12px rgba(11,11,11,.05);padding:12px 14px;min-width:0}
.card h3{margin:0;font-family:var(--font-strong);font-weight:600;font-size:12.5px;color:var(--ink)}
.card .sub{margin:2px 0 8px;color:var(--muted);font-size:11px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));margin-bottom:12px}
.kpi h3{color:var(--ink-2);font-size:11.5px}
.kpi .v{font-family:var(--font-strong);font-weight:600;font-size:28px;letter-spacing:-.01em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.kpi .d{font-family:var(--font-strong);font-weight:600;font-size:11.5px;font-variant-numeric:tabular-nums}
.pos{color:var(--good-text)} .neg{color:var(--bad)} .neu{color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--ink-2);margin-bottom:4px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important;height:2px}
.legend i.sq{width:10px;height:10px;border-radius:2px}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--font);fill:var(--muted);font-size:10px}
svg .lbl{fill:var(--ink-2);font-size:10px}
.tbl{overflow:auto;max-height:var(--h,236px)}
table{border-collapse:collapse;width:100%;font-size:11.5px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--page);color:var(--ink-2);font-family:var(--font-strong);font-weight:600;text-align:right;padding:6px 6px;white-space:nowrap;z-index:1}
th:first-child,td:first-child{text-align:left}
td{padding:5px 6px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
tr.l0 td:first-child{font-family:var(--font-strong);font-weight:600}
tr.l1 td:first-child{padding-left:22px} tr.l2 td:first-child{padding-left:40px;color:var(--ink-2)}
tr.tot td{font-family:var(--font-strong);font-weight:600;background:var(--page);border-bottom:0}
.exp{all:unset;cursor:pointer;display:inline-flex;width:14px;color:var(--muted);font-size:10px}
#tip{position:fixed;pointer-events:none;background:var(--navy);color:#fff;border-radius:8px;padding:7px 10px;font-size:11.5px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:50;max-width:260px;font-variant-numeric:tabular-nums}
#tip b{font-family:var(--font-strong);font-weight:600}
#tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:10px;color:var(--muted);font-size:11px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c3{grid-column:span 3}.c12{grid-column:span 12}
@media (max-width:1080px){header.hdr{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}
@media (max-width:820px){.grid>.card{grid-column:span 12}.slicers{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}.kpi .v{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="app-bar">
    <span><b>FMCG_MonthEnd.pbip</b> · design preview rendered from the same synthetic dataset and measure logic as the Power BI model</span>
    <nav class="tabs" role="tablist" aria-label="Report pages">
      <button class="tab" role="tab" id="t0" data-p="0">Executive Summary</button>
      <button class="tab" role="tab" id="t1" data-p="1">Variance Analysis</button>
      <button class="tab" role="tab" id="t2" data-p="2">Monthly &amp; Quarterly KPIs</button>
      <button class="tab" role="tab" id="t3" data-p="3">Product &amp; Region Drilldown</button>
    </nav>
  </div>
  <header class="hdr">
    <div><h1 id="pgTitle">Executive Summary</h1><p id="pgSub"></p></div>
    <div class="slicers">
      <div class="slicer"><label for="fYear">Year</label><select id="fYear"></select></div>
      <div class="slicer"><label for="fMonth">Month</label><select id="fMonth"></select></div>
      <div class="slicer"><label for="fRegion">Region</label><select id="fRegion"></select></div>
      <div class="slicer"><label for="fChannel">Channel</label><select id="fChannel"></select></div>
      <div class="slicer"><label for="fCat">Category</label><select id="fCat"></select></div>
    </div>
    <div class="period"><small>Close period</small><b id="periodLbl"></b></div>
  </header>
  <main id="page"></main>
  <div class="foot"><span>Aurora Consumer Goods (fictional) · synthetic data · USD</span><span id="asOf"></span></div>
</div>
<div id="tip" hidden></div>

<script>
const DATA = /*__DATA__*/null;
(() => {
const D = DATA, NM = D.months.length, LAST = D.lastClosed, NP = D.products.length, NR = D.regions.length;
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const yOf = m => +D.months[m].slice(0,4), moOf = m => +D.months[m].slice(5,7);
const mLabel = m => MON[moOf(m)-1] + " " + yOf(m);
const C = {actual:"#2A78D6", forecast:"#EB6834", budget:"#1BAF7A", prior:"#A9A7A0", good:"#0CA30C", bad:"#D03B3B", ink2:"#52514E", muted:"#898781", grid:"#ECEBE6", axis:"#C3C2B7"};
const TARGET = 0.90;
const st = {page:0, year:-1, month:-1, region:-1, channel:-1, cat:-1, open:{}};

// ---------- formatting
const money = (v, dp) => { if (v == null || isNaN(v)) return "–"; const a = Math.abs(v), s = v < 0 ? "-" : "";
  if (a >= 1e6) return s + "$" + (a/1e6).toFixed(dp ?? 2) + "M"; if (a >= 1e3) return s + "$" + (a/1e3).toFixed(dp ?? 0) + "K"; return s + "$" + a.toFixed(0); };
const smoney = v => (v >= 0 ? "+" : "") + money(v);
const pct = (v, dp=1) => v == null || !isFinite(v) ? "–" : (v*100).toFixed(dp) + "%";
const spct = (v, dp=1) => v == null || !isFinite(v) ? "–" : (v >= 0 ? "+" : "") + (v*100).toFixed(dp) + "%";
const spp = v => v == null || !isFinite(v) ? "–" : (v >= 0 ? "+" : "") + (v*100).toFixed(1) + " pp";
const arrow = (v, f=pct) => v == null || !isFinite(v) ? "–" : (v >= 0 ? "▲ " : "▼ ") + f(Math.abs(v));
const tone = (v, tol=0.005, invert=false) => v == null || !isFinite(v) ? "neu" : (invert ? -v : v) >= tol ? "pos" : (invert ? -v : v) <= -tol ? "neg" : "neu";
const num = v => v == null ? "–" : Math.round(v).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- filtering (mirrors slicers on Region, Channel, Category)
let A, P, CU;
function rowsPass(t, i) {
  return (st.region < 0 || t.r[i] === st.region) && (st.channel < 0 || t.c[i] === st.channel) && (st.cat < 0 || D.products[t.p[i]].cat === st.cat);
}
function applyDims() {
  A = []; for (let i = 0; i < D.act.m.length; i++) if (rowsPass(D.act, i)) A.push(i);
  P = []; for (let i = 0; i < D.plan.m.length; i++) if (rowsPass(D.plan, i)) P.push(i);
  CU = []; for (let i = 0; i < D.cust.m.length; i++) { const cu = D.customers[D.cust.k[i]];
    if ((st.region < 0 || cu.region === st.region) && (st.channel < 0 || cu.channel === st.channel) && (st.cat < 0 || D.cust.c[i] === st.cat)) CU.push(i); }
}
// month-level sums (used by every period measure)
function monthSums() {
  const z = () => Array(NM).fill(0), o = {u:z(),g:z(),d:z(),n:z(),k:z(),fu:z(),fn:z(),fk:z(),bu:z(),bn:z(),bk:z()};
  const a = D.act, p = D.plan;
  for (const i of A) { const m = a.m[i]; o.u[m]+=a.u[i]; o.g[m]+=a.g[i]; o.d[m]+=a.d[i]; o.n[m]+=a.n[i]; o.k[m]+=a.k[i]; }
  for (const i of P) { const m = p.m[i]; o.fu[m]+=p.fu[i]; o.fn[m]+=p.fn[i]; o.fk[m]+=p.fk[i]; o.bu[m]+=p.bu[i]; o.bn[m]+=p.bn[i]; o.bk[m]+=p.bk[i]; }
  return o;
}
const range = (a, b) => { const r = []; for (let m = Math.max(0,a); m <= Math.min(NM-1,b); m++) r.push(m); return r; };
const sum = (arr, ms) => ms.reduce((s, m) => s + arr[m], 0);
const closed = ms => ms.filter(m => m <= LAST);

// Reporting date = end of the slicer selection, capped at the last closed month ([Reporting Date])
function sliceMonths() { return range(0, NM-1).filter(m => (st.year < 0 || yOf(m) === st.year) && (st.month < 0 || moOf(m) === st.month)); }
function reportingMonth() { const ms = sliceMonths(); if (!ms.length || ms[0] > LAST) return null; return Math.min(ms[ms.length-1], LAST); }
function periods(rd) {
  const y0 = rd - (moOf(rd) - 1), q0 = rd - ((moOf(rd) - 1) % 3);
  return { Month:[rd,rd], PM:[rd-1,rd-1], PYM:[rd-12,rd-12], QTD:[q0,rd], PQTD:[q0-3,rd-3], PYQTD:[q0-12,rd-12],
           YTD:[y0,rd], PYYTD:[y0-12,rd-12], R12M:[rd-11,rd], PYR12M:[rd-23,rd-12], FY:[y0,y0+11], R3M:[rd-2,rd] };
}

// SKU x Region x Month absolute error (Forecast Abs Error / Forecast Accuracy %)
function accuracy(ms) {
  ms = closed(ms); if (!ms.length) return {acc:null, wmape:null, bias:null, mape:null};
  const set = new Set(ms), key = (m,p,r) => (m*NP + p)*NR + r, act = new Map(), fc = new Map(), a = D.act, p = D.plan;
  for (const i of A) if (set.has(a.m[i])) { const k = key(a.m[i],a.p[i],a.r[i]); act.set(k, (act.get(k)||0) + a.n[i]); }
  for (const i of P) if (set.has(p.m[i])) { const k = key(p.m[i],p.p[i],p.r[i]); fc.set(k, (fc.get(k)||0) + p.fn[i]); }
  let err = 0, tA = 0, tF = 0; const keys = new Set([...act.keys(), ...fc.keys()]);
  for (const k of keys) { const x = act.get(k)||0, f = fc.get(k)||0; err += Math.abs(x - f); tA += x; tF += f; }
  // MAPE at SKU x Month grain
  const a2 = new Map(), f2 = new Map();
  for (const [k,v] of act) { const k2 = Math.floor(k / NR); a2.set(k2, (a2.get(k2)||0) + v); }
  for (const [k,v] of fc) { const k2 = Math.floor(k / NR); f2.set(k2, (f2.get(k2)||0) + v); }
  let ms_ = 0, n = 0; for (const [k,v] of a2) if (v > 0) { ms_ += Math.abs(v - (f2.get(k)||0)) / v; n++; }
  const wmape = tA ? err / tA : null;
  return {acc: wmape == null ? null : Math.max(0, 1 - wmape), wmape, bias: tA ? (tF - tA) / tA : null, mape: n ? ms_/n : null};
}
// Budget -> actual bridge at SKU x Month grain
function bridge(ms) {
  ms = closed(ms); const set = new Set(ms), a = D.act, p = D.plan, ua = new Map(), na = new Map(), ub = new Map(), nb = new Map();
  for (const i of A) if (set.has(a.m[i])) { const k = a.m[i]*NP + a.p[i]; ua.set(k,(ua.get(k)||0)+a.u[i]); na.set(k,(na.get(k)||0)+a.n[i]); }
  for (const i of P) if (set.has(p.m[i])) { const k = p.m[i]*NP + p.p[i]; ub.set(k,(ub.get(k)||0)+p.bu[i]); nb.set(k,(nb.get(k)||0)+p.bn[i]); }
  let vol = 0, tA = 0, tB = 0; for (const k of new Set([...na.keys(), ...nb.keys()])) {
    const UA = ua.get(k)||0, NA = na.get(k)||0, UB = ub.get(k)||0, NB = nb.get(k)||0; tA += NA; tB += NB;
    vol += UB === 0 ? NA - NB : (UA - UB) * NB / UB; }
  return {budget:tB, volume:vol, price:(tA - tB) - vol, actual:tA};
}
// grouped sums over a month set: key fn on row index
function groupBy(t, rows, ms, keyFn, fields) {
  const set = new Set(ms), out = new Map();
  for (const i of rows) if (set.has(t.m[i])) { const k = keyFn(i); let o = out.get(k); if (!o) { o = {}; fields.forEach(f => o[f] = 0); out.set(k, o); } fields.forEach(f => o[f] += t[f][i]); }
  return out;
}

// ---------- tooltip
const tip = document.getElementById("tip");
function showTip(e, html) { tip.innerHTML = html; tip.hidden = false; const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14; tip.style.left = x + "px"; tip.style.top = y + "px"; }
function hideTip() { tip.hidden = true; }
document.addEventListener("scroll", hideTip, {passive:true});
function bindTips(root) { root.querySelectorAll("[data-tip]").forEach(n => { n.addEventListener("mousemove", e => showTip(e, n.getAttribute("data-tip"))); n.addEventListener("mouseleave", hideTip); }); }
const sw = c => `<span class="sw" style="background:${c}"></span>`;

// ---------- SVG charts (thin marks, recessive grid, one axis)
function niceScale(lo, hi, n=4) { if (lo === hi) { hi = lo + 1; } const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), err = step0 / mag;
  const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag; const a = Math.floor(lo/step)*step, b = Math.ceil(hi/step)*step; const t = []; for (let v = a; v <= b + step/2; v += step) t.push(+v.toFixed(10)); return {lo:a, hi:b, ticks:t}; }
function axisFmt(fmt) { return fmt === "pct" ? v => (v*100).toFixed(Math.abs(v) < 0.1 && v !== 0 ? 1 : 0) + "%" : v => money(v, Math.abs(v) >= 1e6 ? 1 : 0); }
function valFmt(fmt) { return fmt === "pct" ? v => pct(v) : v => money(v); }

function lineChart({labels, series, fmt="money", height=210, yMin, yMax, highlight, W=610}) {
  const H = height, L = 52, R = 10, T = 8, B = 24, vals = series.flatMap(s => s.values.filter(v => v != null));
  const sc = niceScale(yMin ?? Math.min(...vals) * 0.96, yMax ?? Math.max(...vals) * 1.02); const n = labels.length;
  const x = i => L + (n === 1 ? (W-L-R)/2 : i * (W-L-R) / (n-1)), y = v => T + (H-T-B) * (1 - (v - sc.lo) / (sc.hi - sc.lo)), af = axisFmt(fmt), vf = valFmt(fmt);
  let g = sc.ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="${C.grid}"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${af(t)}</text>`).join("");
  const step = Math.ceil(n / 8); g += labels.map((l, i) => i % step ? "" : `<text x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`).join("");
  if (highlight != null) g += `<rect x="${x(highlight)-((W-L-R)/(n-1))/2}" y="${T}" width="${(W-L-R)/(n-1)}" height="${H-T-B}" fill="#0F1B2D" opacity=".04"/>`;
  for (const s of series) { let d = "", pen = false; s.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); pen = true; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""}/>`;
    const li = s.values.map((v,i)=>v==null?-1:i).filter(i=>i>=0).pop(); if (li != null && li >= 0 && s.endDot) g += `<circle cx="${x(li)}" cy="${y(s.values[li])}" r="4" fill="${s.color}" stroke="#fff" stroke-width="2"/>`; }
  const colW = (W-L-R) / Math.max(1, n-1);
  g += labels.map((l, i) => { const rows = series.filter(s => s.values[i] != null).map(s => `${sw(s.color)}${esc(s.name)} <b>${vf(s.values[i])}</b>`).join("<br>");
    return `<rect x="${x(i)-colW/2}" y="${T}" width="${colW}" height="${H-T-B}" fill="transparent" data-tip="${esc(`<b>${esc(l)}</b><br>${rows}`)}"/>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function columnChart({labels, values, colors, fmt="money", height=210, series, W=610}) {
  const H = height, L = 52, R = 10, T = 14, B = 24; const multi = series || [{name:"", values, colors}];
  const vals = multi.flatMap(s => s.values.filter(v => v != null)); const sc = niceScale(Math.min(0, ...vals), Math.max(0, ...vals));
  const n = labels.length, band = (W-L-R) / n, k = multi.length, bw = Math.min(28, (band * 0.7) / k), y = v => T + (H-T-B) * (1 - (v - sc.lo) / (sc.hi - sc.lo)), af = axisFmt(fmt), vf = valFmt(fmt);
  let g = sc.ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="${t === 0 ? C.axis : C.grid}"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${af(t)}</text>`).join("");
  labels.forEach((l, i) => { const cx = L + band * i + band/2; g += `<text x="${cx}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`;
    multi.forEach((s, j) => { const v = s.values[i]; if (v == null) return; const x0 = cx - (k*bw + (k-1)*2)/2 + j*(bw+2), y0 = y(Math.max(0,v)), h = Math.abs(y(v) - y(0)), col = s.colors ? s.colors[i] : s.color;
      g += `<path d="${roundedBar(x0, y0, bw, h, v >= 0)}" fill="${col}" data-tip="${esc(`<b>${esc(l)}</b>${s.name ? " · " + esc(s.name) : ""}<br>${vf(v)}`)}"/>`;
      if (k === 1 && n <= 14) g += `<text class="lbl" x="${cx}" y="${v >= 0 ? y0 - 4 : y0 + h + 11}" text-anchor="middle">${fmt === "pct" ? pct(v) : money(v, 0)}</text>`; }); });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;

    return `<tr class="l${lvl}"><td>${key ? `<button class="exp" data-k="${key}" aria-label="Expand ${esc(name)}">${st.open[key] ? "▾" : "▸"}</button>` : `<span class="exp"></span>`}${esc(name)}</td><td>${money(n)}</td><td class="${tone(pop)}">${spct(pop)}</td><td class="${tone(yoy)}">${spct(yoy)}</td><td>${pct(1 - sum(S.k,mm)/n)}</td><td>${pct(sum(S.d,mm)/sum(S.g,mm))}</td><td>${num(sum(S.u,mm))}</td><td>$${(n/sum(S.u,mm)).toFixed(2)}</td><td class="${tone(vb)}">${spct(vb)}</td><td>${pct(acc(mm))}</td></tr>`; };
  let rows = ""; for (const yy of years.slice().reverse()) { const ym = range(0, LAST).filter(m => yOf(m) === yy); if (!ym.length) continue; const ky = "y" + yy;
    rows += line(String(yy), ym, ym.map(m => m-12), 0, ky); if (st.open[ky]) for (let qq = 4; qq >= 1; qq--) { const qm = ym.filter(m => Math.ceil(moOf(m)/3) === qq); if (!qm.length) continue; const kq = ky + "q" + qq;
      rows += line("Q" + qq, qm, qm.map(m => m-3), 1, kq); if (st.open[kq]) qm.slice().reverse().forEach(m => rows += line(MON[moOf(m)-1], [m], [m-1], 2)); } }
  if (!Object.keys(st.open).some(k => k.startsWith("y"))) { st.open["y" + yr] = true; st.open["y" + yr + "q" + Math.ceil(moOf(LAST)/3)] = true; return page3({S, rd, pr, get}); }
  const win = inSlice(range(LAST-12, LAST)), gmS = win.map(m => 1 - S.k[m]/S.n[m]), bS = win.map(m => 1 - S.bk[m]/S.bn[m]);
  h += `<div class="grid">`
    + card("c6", `Cumulative net sales: ${yr}`, "Actual vs forecast, budget and prior year", legend([["Actual YTD",C.actual],["Forecast YTD",C.forecast,1],["Budget YTD",C.budget,1],["Prior year YTD",C.prior]]) + ytdRace)
    + card("c6", "Quarterly net sales by year", "Like-for-like quarter comparison (Q4 2026 has no closed months yet)", legend(years.map((yy, j) => [String(yy), [C.prior, "#86B6EF", C.actual][j]])) + qCols)
    + card("c8", "Period KPI table", "Year › quarter › month; PoP = MoM at month, QoQ at quarter, YoY at year", `<div class="tbl" style="--h:262px"><table><thead><tr><th>Period</th><th>Net sales</th><th>PoP %</th><th>YoY %</th><th>GM %</th><th>Disc %</th><th>Units</th><th>Net price</th><th>vs Budget</th><th>Fcst acc.</th></tr></thead><tbody>${rows}</tbody></table></div>`)
    + card("c4", "Gross margin % vs budget", "Last 13 closed months", legend([["Actual GM %",C.actual],["Budget GM %",C.budget,1]]) + lineChart({labels:win.map(m => MON[moOf(m)-1] + " " + String(yOf(m)).slice(2)), series:[{name:"Actual GM %", color:C.actual, width:2.5, values:gmS, endDot:true},{name:"Budget GM %", color:C.budget, dash:"2 3", values:bS}], fmt:"pct", height:300, W:393}))
    + `</div>`;
  return h;
}
function page4({S, rd, pr, get}) {
  const ytd = range(...pr.YTD), pyy = range(...pr.PYYTD);
  const a = groupBy(D.act, A, ytd, i => D.act.p[i], ["n","k","u"]), ap = groupBy(D.act, A, pyy, i => D.act.p[i], ["n"]), pl = groupBy(D.plan, P, ytd, i => D.plan.p[i], ["fn","bn"]);
  const row = p => ({n:a.get(p)?.n||0, k:a.get(p)?.k||0, u:a.get(p)?.u||0, py:ap.get(p)?.n||0, f:pl.get(p)?.fn||0, b:pl.get(p)?.bn||0});
  const agg = ps => ps.reduce((o,p) => { const r = row(p); for (const k in r) o[k] += r[k]; return o; }, {n:0,k:0,u:0,py:0,f:0,b:0});
  const allP = D.products.map((_, i) => i).filter(p => st.cat < 0 || D.products[p].cat === st.cat), T = agg(allP);
  const line = (name, r, lvl, key) => `<tr class="l${lvl}"><td>${key ? `<button class="exp" data-k="${key}" aria-label="Expand ${esc(name)}">${st.open[key] ? "▾" : "▸"}</button>` : `<span class="exp"></span>`}${esc(name)}</td><td>${money(r.n)}</td><td>${pct(r.n/T.n)}</td><td class="${tone((r.n-r.py)/r.py)}">${spct((r.n-r.py)/r.py)}</td><td>${pct(1-r.k/r.n)}</td><td class="${tone((r.n-r.f)/r.f)}">${spct((r.n-r.f)/r.f)}</td><td class="${tone((r.n-r.b)/r.b)}">${spct((r.n-r.b)/r.b)}</td><td>${num(r.u)}</td></tr>`;
  let rows = ""; const cats = [...new Set(allP.map(p => D.products[p].cat))].map(cq => ({cq, ps:allP.filter(p => D.products[p].cat === cq)})).map(o => ({...o, r:agg(o.ps)})).filter(o => o.r.n).sort((x,y) => y.r.n - x.r.n);
  for (const {cq, ps, r} of cats) { const k = "pc" + cq; rows += line(D.categories[cq], r, 0, k);
    if (st.open[k]) { const brands = [...new Set(ps.map(p => D.products[p].brand))].map(bn => ({bn, ps:ps.filter(p => D.products[p].brand === bn)})).map(o => ({...o, r:agg(o.ps)})).sort((x,y) => y.r.n - x.r.n);
      for (const {bn, ps:bp, r:br} of brands) { const kb = "pb" + bn; rows += line(bn, br, 1, kb); if (st.open[kb]) bp.map(p => ({p, r:row(p)})).sort((x,y) => y.r.n - x.r.n).forEach(({p, r:x}) => rows += line(D.products[p].name.replace(bn + " ", ""), x, 2)); } } }
  rows += line("Total", T, 0).replace('class="l0"', 'class="tot"');
  const pts = allP.map(p => ({p, r:row(p)})).filter(o => o.r.n > 0 && o.r.py > 0).map(o => ({label:D.products[o.p].name, x:(o.r.n-o.r.py)/o.r.py, y:1-o.r.k/o.r.n, r:o.r.n}));
  const rg = groupBy(D.act, A, ytd, i => D.act.r[i], ["n"]), rgp = groupBy(D.act, A, pyy, i => D.act.r[i], ["n"]); const rs = range(0, NR-1).filter(i => rg.get(i)).sort((x,y) => rg.get(y).n - rg.get(x).n);
  const groups = ["Retail","Digital","B2B","Out-of-Home"], chG = {0:0,1:0,2:1,3:2,4:3}, rc = groupBy(D.act, A, ytd, i => D.act.r[i]*10 + chG[D.act.c[i]], ["n"]);
  const rcRows = rs.map(ri => `<tr><td>${D.regions[ri]}</td>${groups.map((_, g) => `<td>${money(rc.get(ri*10+g)?.n||0)}</td>`).join("")}<td><b>${money(rg.get(ri).n)}</b></td></tr>`).join("")
    + `<tr class="tot"><td>Total</td>${groups.map((_, g) => `<td>${money(rs.reduce((s,ri) => s + (rc.get(ri*10+g)?.n||0), 0))}</td>`).join("")}<td>${money(rs.reduce((s,ri) => s + rg.get(ri).n, 0))}</td></tr>`;
  const cu = D.cust, cy = new Set(ytd), cp = new Set(pyy), cm = new Map(); for (const i of CU) { const k = cu.k[i]; let o = cm.get(k); if (!o) cm.set(k, o = {n:0,g:0,py:0}); if (cy.has(cu.m[i])) { o.n += cu.n[i]; o.g += cu.g[i]; } else if (cp.has(cu.m[i])) o.py += cu.n[i]; }
  const top = [...cm.entries()].filter(([,o]) => o.n > 0).sort((x,y) => y[1].n - x[1].n);
  const custRows = top.map(([k,o], i) => `<tr><td>${i+1}</td><td style="text-align:left">${esc(D.customers[k].name)}</td><td>${money(o.n)}</td><td class="${tone((o.n-o.py)/o.py)}">${spct((o.n-o.py)/o.py)}</td><td>${pct(1-o.g/o.n)}</td></tr>`).join("");
  return `<div class="grid">`
    + card("c7", "Portfolio performance", "Category › brand › SKU · click ▸ to drill", `<div class="tbl" style="--h:300px"><table><thead><tr><th>Category / brand / SKU</th><th>Net sales YTD</th><th>Share</th><th>YoY</th><th>GM %</th><th>vs Fcst</th><th>vs Bud</th><th>Units</th></tr></thead><tbody>${rows}</tbody></table></div>`)
    + card("c5", "SKU portfolio: growth vs margin", "Bubble size = YTD net sales · hover a bubble for the SKU", scatter(pts))
    + card("c4", "Region: YTD vs prior year", "", legend([["YTD",C.actual],["Prior year YTD",C.prior]]) + hbar({labels:rs.map(i => D.regions[i]), series:[{name:"YTD", color:C.actual, values:rs.map(i => rg.get(i).n)},{name:"Prior year YTD", color:C.prior, values:rs.map(i => rgp.get(i)?.n||0)}], rowH:34, labelW:70, W:393}))
    + card("c4", "Region × channel group · YTD", "", `<div class="tbl"><table><thead><tr><th>Region</th>${groups.map(g => `<th>${g}</th>`).join("")}<th>Total</th></tr></thead><tbody>${rcRows}</tbody></table></div>`)
    + card("c4", "Customer ranking · YTD", "", `<div class="tbl"><table><thead><tr><th>#</th><th style="text-align:left">Customer</th><th>Net sales</th><th>YoY</th><th>GM %</th></tr></thead><tbody>${custRows}</tbody></table></div>`)
    + `</div>`;
}

// ---------- slicers
const fill = (id, opts) => { document.getElementById(id).innerHTML = opts.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join(""); };
fill("fYear", [[-1,"All"], ...[...new Set(D.months.map((_, m) => yOf(m)))].map(y => [y, y])]);
fill("fMonth", [[-1,"All"], ...MON.map((m, i) => [i+1, m])]);
fill("fRegion", [[-1,"All"], ...D.regions.map((r, i) => [i, r])]);
fill("fChannel", [[-1,"All"], ...D.channels.map((r, i) => [i, r])]);
fill("fCat", [[-1,"All"], ...D.categories.map((r, i) => [i, r])]);
[["fYear","year"],["fMonth","month"],["fRegion","region"],["fChannel","channel"],["fCat","cat"]].forEach(([id, k]) => document.getElementById(id).addEventListener("change", e => { st[k] = +e.target.value; render(); }));
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { st.page = +t.dataset.p; try { localStorage.setItem("fmcg-page", st.page); } catch (e) {} render(); }));
try { const p = +localStorage.getItem("fmcg-page"); if (p >= 0 && p <= 3) st.page = p; } catch (e) {}
const h = location.hash.replace("#", ""); const hp = ["summary","variance","kpis","drilldown"].indexOf(h); if (hp >= 0) st.page = hp;
render();
})();
</script>
